[package]
name = "strap"
version = "0.1.0"
edition = "2024"

[build-dependencies]
bindgen = "0.72.1"

[dependencies]
elf = { version = "0.8.0", default-features = false }
hal = { version = "0.1.0", path = "../hal" }
kernel = { version = "0.1.0", path = "../kernel" }
log = { version = "0.4.30", default-features = false }
ratatui = { version = "0.30.2", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
toml = { version = "1.1.2", default-features = false, features = ["serde", "parse"] }

[target.x86_64-unknown-uefi.dependencies]
uefi = { version = "0.37.0", features = ["alloc", "global_allocator", "panic_handler"] }

[target.aarch64-unknown-uefi.dependencies]
uefi = { version = "0.37.0", features = ["alloc", "global_allocator", "panic_handler"] }

[target.x86_64-unknown-linux-musl.dependencies]
libc = "0.2.186"
