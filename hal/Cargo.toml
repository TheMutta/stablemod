[package]
name = "hal"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.33"

[target.'cfg(feature = "use_std")'.dependencies]
libc = "0.2"

[target.x86_64-unknown-none.dependencies]
x86_64 = { version = "0.15.4", features = ["memory_encryption"] }

[target.x86_64-unknown-uefi.dependencies]
x86_64 = { version = "0.15.4", features = ["memory_encryption"] }
uefi = "0.37.0"

[target.'cfg(target_os = "linux")'.dependencies]
x86_64 = { version = "0.15.4", features = ["memory_encryption"] }
syscalls = { version = "0.8.1", default-features = false }

[target.aarch64-unknown-uefi.dependencies]
uefi = "0.37.0"
