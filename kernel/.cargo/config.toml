[target.aarch64-unknown-none.unstable]
build-std = "core,compiler_builtins,alloc"
build-std-features = "compiler-builtins-mem"

[target.x86_64-unknown-linux-musl.unstable]
build-std = "core,compiler_builtins,alloc"
build-std-features = "compiler-builtins-mem"

[target.x86_64-unknown-none.unstable]
build-std = "core,compiler_builtins,alloc"
build-std-features = "compiler-builtins-mem"

[target.x86_64-unknown-linux-musl]
rustflags = [
	"-C", "panic=abort",
	"-C", "link-args=-shared",
	"-C", "link-args=-pie",
]
[target.x86_64-unknown-none]
rustflags = [
	"-C", "link-args=-static",
	"-C", "link-args=-pie",
]
[target.aarch64-unknown-none]
rustflags = [
	"-C", "link-args=-static",
	"-C", "link-args=-pie",
]

