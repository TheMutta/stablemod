[unstable]
build-std-features = ["compiler-builtins-mem"]
build-std = ["core", "alloc", "compiler_builtins"]
[build]
target = ["aarch64-unknown-none", "x86_64-unknown-none"]
[target.x86_64-unknown-none]
rustflags = [
	"-C", "link-args=-static",
	"-C", "link-args=-pie",
]
[target.aarch64-unknown-none]
rustflags = [
	"-C", "link-args=-static",
	"-C", "link-args=-pie",
]

